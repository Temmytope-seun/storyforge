services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: storyforge
      POSTGRES_DB: storyforge
    ports:
      - "5432:5432"
    volumes:
      - storyforge_db_data:/var/lib/postgresql/data

volumes:
  storyforge_db_data:
